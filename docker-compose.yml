version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Ajuste a porta conforme necessário
    environment:
      - NODE_ENV=production
      # Adicione suas variáveis de ambiente aqui
    restart: unless-stopped
    # volumes:  # Descomente se precisar de volumes
    #   - ./data:/app/data